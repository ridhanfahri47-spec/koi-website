<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgEkskul" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="shirtEkskul" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" rx="16" fill="url(#bgEkskul)"/>
  
  <g fill="rgba(255,255,255,0.05)">
    <circle cx="50" cy="50" r="3"/><circle cx="100" cy="50" r="3"/><circle cx="150" cy="50" r="3"/>
    <circle cx="450" cy="380" r="3"/><circle cx="500" cy="380" r="3"/><circle cx="550" cy="380" r="3"/>
  </g>

  <circle cx="300" cy="225" r="150" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" stroke-dasharray="6 6"/>
  <circle cx="300" cy="225" r="120" fill="rgba(56, 189, 248, 0.08)"/>

  <!-- T-Shirt Ekskul / Sekolah -->
  <g transform="translate(160, 60)">
    <path d="M 90 35 L 140 15 L 190 35 L 265 85 L 230 145 L 200 125 L 200 310 L 80 310 L 80 125 L 50 145 L 15 85 Z" fill="url(#shirtEkskul)" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 115 25 C 115 50, 165 50, 165 25" fill="#0369a1" stroke="#38bdf8" stroke-width="2.5"/>
    
    <!-- Ekskul Emblem on Chest -->
    <circle cx="140" cy="135" r="38" fill="#ffffff" opacity="0.95"/>
    <path d="M 140 110 L 152 124 L 168 124 L 156 136 L 160 152 L 140 142 L 120 152 L 124 136 L 112 124 L 128 124 Z" fill="#f59e0b"/>
    <text x="140" y="172" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11" fill="#fff" text-anchor="middle">OSIS &amp; EKSKUL</text>
    
    <!-- Sleeve accent stripes -->
    <path d="M 23 98 L 47 138" stroke="#f59e0b" stroke-width="4"/>
    <path d="M 257 98 L 233 138" stroke="#f59e0b" stroke-width="4"/>
  </g>

  <!-- Medal / Trophy Icon beside -->
  <g transform="translate(420, 130)">
    <circle cx="35" cy="35" r="28" fill="#f59e0b"/>
    <circle cx="35" cy="35" r="22" fill="#fbbf24"/>
    <text x="35" y="42" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#78350f" text-anchor="middle">★</text>
    <path d="M 25 60 L 15 100 L 35 88 L 55 100 L 45 60 Z" fill="#ef4444"/>
    <path d="M 35 60 L 35 88" stroke="#991b1b" stroke-width="2"/>
  </g>

  <!-- Floating Tags -->
  <g transform="translate(60, 350)">
    <rect width="210" height="38" rx="19" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="105" y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="13" fill="#fff" text-anchor="middle">🎓 Paket Hemat Pelajar</text>
  </g>
  <g transform="translate(330, 350)">
    <rect width="210" height="38" rx="19" fill="rgba(15, 23, 42, 0.9)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="105" y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="13" fill="#fff" text-anchor="middle">🎨 Free Jasa Desain Kaos</text>
  </g>
