<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="qcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#qcBg)"/>

  <!-- Clipboard & Checklist -->
  <g transform="translate(80, 50)">
    <rect x="0" y="20" width="220" height="280" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Clipboard clip -->
    <rect x="65" y="5" width="90" height="30" rx="6" fill="#475569"/>
    <circle cx="110" cy="18" r="6" fill="#e2e8f0"/>

    <!-- Checklist rows -->
    <g transform="translate(25, 60)">
      <circle cx="12" cy="12" r="10" fill="#22c55e"/>
      <path d="M 8 12 L 11 15 L 17 8" stroke="#fff" stroke-width="2" fill="none"/>
      <rect x="32" y="7" width="130" height="10" rx="3" fill="#334155"/>
      <text x="32" y="28" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="9" fill="#64748b">Cek Jahitan Rantai &amp; Obras</text>
    </g>

    <g transform="translate(25, 110)">
      <circle cx="12" cy="12" r="10" fill="#22c55e"/>
      <path d="M 8 12 L 11 15 L 17 8" stroke="#fff" stroke-width="2" fill="none"/>
      <rect x="32" y="7" width="130" height="10" rx="3" fill="#334155"/>
      <text x="32" y="28" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="9" fill="#64748b">Ketajaman &amp; Presisi Sablon</text>
    </g>

    <g transform="translate(25, 160)">
      <circle cx="12" cy="12" r="10" fill="#22c55e"/>
      <path d="M 8 12 L 11 15 L 17 8" stroke="#fff" stroke-width="2" fill="none"/>
      <rect x="32" y="7" width="130" height="10" rx="3" fill="#334155"/>
      <text x="32" y="28" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="9" fill="#64748b">Kesesuaian Ukuran (Size Chart)</text>
    </g>

    <g transform="translate(25, 210)">
      <circle cx="12" cy="12" r="10" fill="#22c55e"/>
      <path d="M 8 12 L 11 15 L 17 8" stroke="#fff" stroke-width="2" fill="none"/>
      <rect x="32" y="7" width="130" height="10" rx="3" fill="#334155"/>
      <text x="32" y="28" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="9" fill="#64748b">Steam &amp; Packing Plastik Satuan</text>
    </g>
  </g>

  <!-- Folded Ironed T-Shirt Pack -->
  <g transform="translate(340, 90)">
    <rect x="10" y="20" width="200" height="180" rx="10" fill="#f97316" stroke="#ea580c" stroke-width="2"/>
    <!-- Folded collar -->
    <path d="M 60 20 L 110 60 L 160 20" fill="#fff" stroke="#ea580c" stroke-width="2"/>
    <!-- Brand Tag -->
    <rect x="90" y="75" width="40" height="60" rx="4" fill="#0f2b48"/>
    <text x="110" y="105" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="10" fill="#ff7844" text-anchor="middle">KOI</text>
    <circle cx="110" cy="85" r="3" fill="#fff"/>
    <!-- Transparent polybag wrap effect -->
    <rect x="0" y="10" width="220" height="200" rx="12" fill="rgba(255,255,255,0.2)" stroke="#fff" stroke-width="1.5"/>
    <line x1="10" y1="200" x2="210" y2="200" stroke="#fff" stroke-width="2" stroke-dasharray="4 2"/>
    
    <!-- Quality Seal Sticker -->
    <circle cx="170" cy="170" r="28" fill="#22c55e" stroke="#fff" stroke-width="3"/>
    <text x="170" y="167" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="9" fill="#fff" text-anchor="middle">QC</text>
    <text x="170" y="179" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="8" fill="#fff" text-anchor="middle">PASSED</text>
  </g>

  <!-- Title Bottom -->
  <rect x="150" y="340" width="300" height="40" rx="20" fill="rgba(15, 23, 42, 0.9)" stroke="#ff7844" stroke-width="1.5"/>
  <text x="300" y="365" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">100% Quality Inspection Guaranteed</text>
</svg>
