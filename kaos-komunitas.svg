    <circle cx="450" cy="380" r="3"/><circle cx="500" cy="380" r="3"/><circle cx="550" cy="380" r="3"/>
  </g>

  <circle cx="300" cy="225" r="150" fill="none" stroke="#34d399" stroke-width="2" opacity="0.3" stroke-dasharray="6 6"/>
