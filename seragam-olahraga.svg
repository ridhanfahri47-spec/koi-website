<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgSport" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="shirtSport" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" rx="16" fill="url(#bgSport)"/>
  
  <g fill="rgba(255,255,255,0.05)">
    <circle cx="50" cy="50" r="3"/><circle cx="100" cy="50" r="3"/><circle cx="150" cy="50" r="3"/>
    <circle cx="450" cy="380" r="3"/><circle cx="500" cy="380" r="3"/><circle cx="550" cy="380" r="3"/>
  </g>

  <circle cx="300" cy="225" r="150" fill="none" stroke="#f87171" stroke-width="2" opacity="0.3" stroke-dasharray="6 6"/>
  <circle cx="300" cy="225" r="120" fill="rgba(248, 113, 113, 0.08)"/>

  <!-- Athletic Jersey -->
  <g transform="translate(160, 60)">
    <!-- Dynamic diagonal speed stripes in background -->
    <path d="M 90 35 L 140 15 L 190 35 L 265 85 L 230 145 L 200 125 L 200 310 L 80 310 L 80 125 L 50 145 L 15 85 Z" fill="url(#shirtSport)" stroke="#fca5a5" stroke-width="2"/>
    <path d="M 115 25 C 115 50, 165 50, 165 25" fill="#1e293b" stroke="#fca5a5" stroke-width="2.5"/>
    
    <!-- Sport Geometric Diagonal Lines -->
    <path d="M 80 160 L 160 310 L 140 310 L 80 190 Z" fill="#ffffff" opacity="0.3"/>
    <path d="M 110 130 L 200 300 L 185 300 L 95 130 Z" fill="#facc15" opacity="0.6"/>

    <!-- Player Number -->
    <text x="140" y="195" font-family="'Plus Jakarta Sans', Impact, sans-serif" font-weight="900" font-size="64" fill="#ffffff" text-anchor="middle" letter-spacing="2">10</text>
    <text x="140" y="115" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="12" fill="#facc15" text-anchor="middle" letter-spacing="4">AREMA FC</text>
    
    <!-- V-neck detail -->
    <polygon points="130,28 150,28 140,55" fill="#ffffff"/>
  </g>

  <!-- Football / Whistle Icon -->
  <g transform="translate(420, 130)">
    <circle cx="35" cy="35" r="28" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="35,22 47,30 43,44 27,44 23,30" fill="#1e293b"/>
    <path d="M 35 22 L 35 10 M 47 30 L 58 24 M 43 44 L 52 56 M 27 44 L 18 56 M 23 30 L 12 24" stroke="#1e293b" stroke-width="2"/>
  </g>

  <!-- Floating Tags -->
  <g transform="translate(60, 350)">
    <rect width="210" height="38" rx="19" fill="rgba(15, 23, 42, 0.9)" stroke="#f87171" stroke-width="1.5"/>
    <text x="105" y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="13" fill="#fff" text-anchor="middle">⚡ Bahan Dryfit Milano Adem</text>
  </g>
  <g transform="translate(330, 350)">
    <rect width="210" height="38" rx="19" fill="rgba(15, 23, 42, 0.9)" stroke="#facc15" stroke-width="1.5"/>
    <text x="105" y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="13" fill="#fff" text-anchor="middle">🏆 Full Print Sublimasi &amp; Sablon</text>
  </g>
</svg>
