<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgSablon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="squeegee" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" rx="16" fill="url(#bgSablon)"/>
  
  <g fill="rgba(255,255,255,0.05)">
    <circle cx="50" cy="50" r="3"/><circle cx="100" cy="50" r="3"/><circle cx="150" cy="50" r="3"/>
    <circle cx="450" cy="380" r="3"/><circle cx="500" cy="380" r="3"/><circle cx="550" cy="380" r="3"/>
  </g>

  <!-- Screen Printing Mesh Frame -->
  <g transform="translate(140, 50)">
    <!-- Wooden / Aluminum Screen Frame -->
    <rect x="0" y="0" width="320" height="260" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="4"/>
    <!-- Mesh Inside -->
    <rect x="25" y="25" width="270" height="210" rx="4" fill="#312e81" opacity="0.85"/>
    <rect x="25" y="25" width="270" height="210" rx="4" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 2"/>
    
    <!-- Stencil Graphic on Mesh -->
    <circle cx="160" cy="130" r="60" fill="none" stroke="#ec4899" stroke-width="8"/>
    <path d="M 130 110 L 160 85 L 190 110 L 180 155 L 140 155 Z" fill="#ec4899"/>
    <text x="160" y="195" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="16" fill="#f43f5e" text-anchor="middle">DTF &amp; PLASTISOL</text>

    <!-- Squeegee (Rakel Sablon) pulling ink -->
    <g transform="translate(40, 70) rotate(-15)">
      <!-- Squeegee Handle -->
      <rect x="0" y="0" width="220" height="30" rx="6" fill="url(#squeegee)" stroke="#b45309" stroke-width="2"/>
      <circle cx="20" cy="15" r="4" fill="#78350f"/><circle cx="200" cy="15" r="4" fill="#78350f"/>
      <!-- Rubber Blade -->
      <rect x="5" y="28" width="210" height="18" rx="2" fill="#22c55e"/>
      <!-- Fresh Ink Trail -->
      <path d="M 10 46 C 40 55, 170 50, 205 46 L 205 75 C 160 70, 50 78, 10 75 Z" fill="#ec4899" opacity="0.85"/>
    </g>
  </g>

  <!-- Color Palette Drop Icons -->
  <g transform="translate(450, 100)">
    <circle cx="25" cy="25" r="16" fill="#ec4899"/>
    <circle cx="25" cy="65" r="16" fill="#06b6d4"/>
    <circle cx="25" cy="105" r="16" fill="#facc15"/>
    <circle cx="25" cy="145" r="16" fill="#22c55e"/>
  </g>

  <!-- Floating Tags -->
  <g transform="translate(60, 350)">
    <rect width="210" height="38" rx="19" fill="rgba(15, 23, 42, 0.9)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="105" y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="13" fill="#fff" text-anchor="middle">🎨 Plastisol, DTF &amp; Rubber</text>
  </g>
  <g transform="translate(330, 350)">
    <rect width="210" height="38" rx="19" fill="rgba(15, 23, 42, 0.9)" stroke="#f472b6" stroke-width="1.5"/>
    <text x="105" y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="13" fill="#fff" text-anchor="middle">✨ Tajam, Presisi &amp; Anti Retak</text>
  </g>
</svg>
