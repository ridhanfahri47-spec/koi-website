<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 550" width="700" height="550">
  <defs>
    <linearGradient id="heroCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="koiPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="koiOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7844"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <filter id="heroShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Decorative Shapes -->
  <circle cx="350" cy="275" r="240" fill="#f1f5f9" opacity="0.6"/>
  <circle cx="350" cy="275" r="180" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="550" cy="120" r="45" fill="#ffedd5" opacity="0.7"/>
  <circle cx="120" cy="420" r="35" fill="#e0f2fe" opacity="0.7"/>

  <!-- Main Canvas: Apparel Production & Quality Showcase -->
  <!-- Card 1: Centered Main T-Shirt Display -->
  <g transform="translate(190, 80)" filter="url(#heroShadow)">
    <rect width="320" height="380" rx="20" fill="url(#heroCardBg)" stroke="#e2e8f0" stroke-width="1.5"/>
    
    <!-- Header of card -->
    <rect x="25" y="25" width="270" height="40" rx="8" fill="#f8fafc"/>
    <circle cx="45" cy="45" r="6" fill="#ef4444"/><circle cx="65" cy="45" r="6" fill="#f59e0b"/><circle cx="85" cy="45" r="6" fill="#10b981"/>
    <text x="180" y="50" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#64748b" text-anchor="middle">KOI APPAREL STUDIO</text>
    
    <!-- Rendered T-Shirt -->
    <g transform="translate(45, 75)">
      <path d="M 65 30 L 115 15 L 165 30 L 225 70 L 195 120 L 170 105 L 170 250 L 60 250 L 60 105 L 35 120 L 5 70 Z" fill="url(#koiPrimaryGrad)"/>
      <path d="M 85 22 C 85 45, 145 45, 145 22" fill="#1e293b" stroke="#ff7844" stroke-width="2"/>
      
      <!-- Screen print graphic on chest -->
      <circle cx="115" cy="110" r="36" fill="rgba(255,255,255,0.06)"/>
      <path d="M 115 85 C 128 92, 132 108, 124 120 C 120 128, 108 128, 102 118 Z" fill="url(#koiOrangeGrad)"/>
      <text x="115" y="142" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11" fill="#fff" text-anchor="middle" letter-spacing="1.5">MALANG</text>
      <text x="115" y="154" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="8" fill="#94a3b8" text-anchor="middle">CREATIVE CLOTHING</text>
      
      <!-- Stitching details -->
      <path d="M 62 242 L 168 242" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="3 2"/>
    </g>

    <!-- Bottom Rating / Spec pill -->
    <rect x="35" y="325" width="250" height="34" rx="8" fill="#eff6ff"/>
    <text x="160" y="347" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#1d4ed8" text-anchor="middle">⭐⭐⭐⭐⭐ 100% Katun Combed 30s</text>
  </g>

  <!-- Floating Badge 1: Top Left - Speed & Guarantee -->
  <g transform="translate(60, 110)" filter="url(#heroShadow)">
    <rect width="180" height="74" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="36" cy="37" r="20" fill="#dcfce7"/>
    <text x="36" y="43" font-size="20" text-anchor="middle">⚡</text>
    <text x="68" y="32" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="13" fill="#0f172a">Pengerjaan Kilat</text>
    <text x="68" y="50" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="11" fill="#16a34a">Tepat Waktu Garansi</text>
  </g>

  <!-- Floating Badge 2: Bottom Left - Machine & Stitch Quality -->
  <g transform="translate(40, 310)" filter="url(#heroShadow)">
    <rect width="195" height="74" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="36" cy="37" r="20" fill="#ffedd5"/>
    <text x="36" y="43" font-size="20" text-anchor="middle">🪡</text>
    <text x="68" y="32" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="13" fill="#0f172a">Jahit Rantai Distro</text>
    <text x="68" y="50" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="11" fill="#ea580c">Rapi &amp; Standar Mall</text>
  </g>

  <!-- Floating Badge 3: Top Right - Orders Produced in Malang -->
  <g transform="translate(480, 140)" filter="url(#heroShadow)">
    <rect width="180" height="74" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="36" cy="37" r="20" fill="#e0e7ff"/>
    <text x="36" y="43" font-size="20" text-anchor="middle">👕</text>
    <text x="68" y="32" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="14" fill="#4338ca">50.000+ Pcs</text>
    <text x="68" y="50" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="11" fill="#64748b">Telah Diproduksi</text>
  </g>

  <!-- Floating Badge 4: Bottom Right - Flexible Min Order -->
  <g transform="translate(470, 340)" filter="url(#heroShadow)">
    <rect width="190" height="74" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="36" cy="37" r="20" fill="#fef08a"/>
    <text x="36" y="43" font-size="20" text-anchor="middle">🔥</text>
    <text x="68" y="32" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="13" fill="#0f172a">Min. 12 Pcs Saja</text>
    <text x="68" y="50" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="11" fill="#ca8a04">Cocok Buat Pelajar/Ekskul</text>
  </g>
</svg>
