<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="koiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5722"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  
  <!-- Emblem: Koi & Needle/Spool Motif -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Circle with sewing stitch effect -->
    <circle cx="40" cy="40" r="38" fill="#fff" stroke="#ff5722" stroke-width="2.5" stroke-dasharray="4 2"/>
    <circle cx="40" cy="40" r="33" fill="#0f2b48"/>
    
    <!-- Stylized Koi fish shape resembling thread needle loop -->
    <path d="M 40 15 C 55 22, 60 40, 52 55 C 46 65, 30 65, 25 52 C 22 45, 25 35, 33 28 C 38 23, 40 18, 40 15 Z" fill="url(#koiGrad)"/>
    <!-- Koi fin / accent -->
    <path d="M 52 42 C 62 40, 65 50, 55 52 Z" fill="#ffab91"/>
    <!-- Koi eye / needle eye -->
    <circle cx="36" cy="27" r="2.5" fill="#ffffff"/>
    <circle cx="36" cy="27" r="1.2" fill="#0f2b48"/>
    <!-- Thread swirl -->
    <path d="M 40 62 Q 40 70, 52 70 T 64 65" fill="none" stroke="#ffab91" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="100" y="48" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="34" fill="url(#textGrad)" letter-spacing="-0.5">KOI<tspan fill="#e65100">KONVEKSI</tspan></text>
  <text x="102" y="74" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="12" fill="#64748b" letter-spacing="3.5">MALANG • APPAREL &amp; SCREEN PRINT</text>
  
  <!-- Badge in corner -->
  <rect x="330" y="24" width="60" height="20" rx="10" fill="#e0f2fe"/>
  <text x="360" y="38" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="10" fill="#0284c7" text-anchor="middle">EST. 2018</text>
</svg>
