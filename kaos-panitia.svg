<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgPanitia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="shirtPanitia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" rx="16" fill="url(#bgPanitia)"/>
  
  <!-- Subtle pattern dots -->
  <g fill="rgba(255,255,255,0.05)">
    <circle cx="50" cy="50" r="3"/><circle cx="100" cy="50" r="3"/><circle cx="150" cy="50" r="3"/>
    <circle cx="50" cy="100" r="3"/><circle cx="100" cy="100" r="3"/><circle cx="150" cy="100" r="3"/>
    <circle cx="450" cy="350" r="3"/><circle cx="500" cy="350" r="3"/><circle cx="550" cy="350" r="3"/>
    <circle cx="450" cy="400" r="3"/><circle cx="500" cy="400" r="3"/><circle cx="550" cy="400" r="3"/>
  </g>

  <!-- Circular Glow -->
  <circle cx="300" cy="225" r="160" fill="none" stroke="#ff7844" stroke-width="2" opacity="0.25" stroke-dasharray="8 6"/>
  <circle cx="300" cy="225" r="130" fill="rgba(255,120,68,0.06)"/>

  <!-- T-Shirt Shape (Kaos Panitia) -->
  <g transform="translate(160, 60)">
    <!-- Shadow -->
    <path d="M 90 40 L 140 20 L 190 40 L 270 90 L 235 150 L 205 130 L 205 320 L 75 320 L 75 130 L 45 150 L 10 90 Z" fill="rgba(0,0,0,0.3)" filter="blur(6px)"/>
    <!-- Body & Sleeves -->
    <path d="M 90 35 L 140 15 L 190 35 L 265 85 L 230 145 L 200 125 L 200 310 L 80 310 L 80 125 L 50 145 L 15 85 Z" fill="url(#shirtPanitia)" stroke="#ff7844" stroke-width="2"/>
    <!-- Collar -->
    <path d="M 115 25 C 115 50, 165 50, 165 25" fill="#0f172a" stroke="#ff7844" stroke-width="2.5"/>
    <!-- Pocket/Print: Panitia Graphic -->
    <rect x="115" y="110" width="50" height="60" rx="6" fill="#ff7844" opacity="0.9"/>
    <circle cx="140" cy="130" r="12" fill="#fff"/>
    <rect x="122" y="148" width="36" height="5" rx="2" fill="#fff"/>
    <rect x="127" y="157" width="26" height="4" rx="2" fill="#fff"/>
    <!-- Back tag text -->
    <text x="140" y="85" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="10" fill="#ff7844" text-anchor="middle">EVENT CREW</text>
    <!-- Stitching lines -->
    <path d="M 82 300 L 198 300" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="3 2"/>
    <path d="M 23 98 L 47 138" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="3 2"/>
    <path d="M 257 98 L 233 138" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="3 2"/>
  </g>

  <!-- ID Card / Lanyard Panitia Badge -->
  <g transform="translate(390, 180) rotate(12)">
    <!-- Lanyard strap -->
    <path d="M 40 -60 Q 30 -20, 35 10" stroke="#ff5722" stroke-width="6" fill="none"/>
    <rect x="0" y="10" width="90" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="25" y="15" width="40" height="6" rx="3" fill="#64748b"/>
    <rect x="10" y="30" width="70" height="22" rx="4" fill="#0f2b48"/>
    <text x="45" y="45" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="10" fill="#fff" text-anchor="middle">PANITIA</text>
    <circle cx="45" cy="75" r="16" fill="#e2e8f0"/>
    <rect x="15" y="100" width="60" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="20" y="112" width="50" height="5" rx="2" fill="#cbd5e1"/>
    <rect x="10" y="125" width="70" height="10" rx="3" fill="#ff5722"/>
  </g>

  <!-- Floating Feature Tags -->
  <g transform="translate(60, 350)">
    <rect width="180" height="38" rx="19" fill="rgba(15, 23, 42, 0.9)" stroke="#ff7844" stroke-width="1.5"/>
    <text x="90" y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="13" fill="#fff" text-anchor="middle">✨ Bahan Combed 30s/24s</text>
  </g>
  <g transform="translate(360, 350)">
    <rect width="180" height="38" rx="19" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="13" fill="#fff" text-anchor="middle">⏱️ Tepat Waktu Garansi</text>
  </g>
</svg>
