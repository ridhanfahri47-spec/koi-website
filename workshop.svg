<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="workshopBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#workshopBg)"/>
  
  <!-- Workshop Interior Graphic -->
  <!-- Floor Grid -->
  <path d="M 0 280 L 600 280 L 600 400 L 0 400 Z" fill="#334155"/>
  <line x1="50" y1="280" x2="0" y2="400" stroke="#475569" stroke-width="2"/>
  <line x1="200" y1="280" x2="150" y2="400" stroke="#475569" stroke-width="2"/>
  <line x1="400" y1="280" x2="450" y2="400" stroke="#475569" stroke-width="2"/>
  <line x1="550" y1="280" x2="600" y2="400" stroke="#475569" stroke-width="2"/>

  <!-- Fabric Rolls Shelf in Background -->
  <rect x="40" y="50" width="180" height="180" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <!-- Fabric roll cylinders -->
  <rect x="50" y="65" width="160" height="24" rx="12" fill="#ef4444"/>
  <rect x="50" y="100" width="160" height="24" rx="12" fill="#3b82f6"/>
  <rect x="50" y="135" width="160" height="24" rx="12" fill="#10b981"/>
  <rect x="50" y="170" width="160" height="24" rx="12" fill="#f59e0b"/>
  <rect x="50" y="200" width="160" height="20" rx="10" fill="#a855f7"/>

  <!-- Industrial Sewing Machine Station -->
  <g transform="translate(260, 140)">
    <!-- Table -->
    <rect x="20" y="110" width="260" height="15" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
    <rect x="40" y="125" width="14" height="120" fill="#475569"/>
    <rect x="240" y="125" width="14" height="120" fill="#475569"/>
    <rect x="30" y="210" width="240" height="10" fill="#334155"/>
    <polygon points="120,220 180,220 170,240 130,240" fill="#64748b"/> <!-- Pedal -->

    <!-- Machine Head -->
    <path d="M 190 110 L 210 50 L 140 50 L 140 85 L 120 85 L 120 110" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <!-- Thread Spool on top -->
    <rect x="185" y="30" width="12" height="20" fill="#ff5722"/>
    <line x1="191" y1="30" x2="125" y2="95" stroke="#ff7844" stroke-width="1.5" stroke-dasharray="2 2"/>
    <line x1="125" y1="95" x2="125" y2="110" stroke="#0f172a" stroke-width="2"/> <!-- Needle -->
    
    <!-- Cloth being sewn -->
    <path d="M 80 108 L 170 108 L 150 120 L 70 120 Z" fill="#f97316"/>
  </g>

  <!-- Badge / Workshop Sign -->
  <rect x="240" y="30" width="310" height="50" rx="10" fill="rgba(15, 43, 72, 0.9)" stroke="#ff7844" stroke-width="1.5"/>
  <text x="395" y="52" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle">WORKSHOP KOI KONVEKSI</text>
  <text x="395" y="70" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="11" fill="#ff7844" text-anchor="middle">📍 Sananrejo, Kec. Turen, Kab. Malang</text>
</svg>
